name: Validate ontology
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tests/verify.py
      - name: Check standalone OWL 2 DL profile
        run: |
          curl --fail --silent --show-error --location --retry 2 -o "$RUNNER_TEMP/robot.jar" https://github.com/ontodev/robot/releases/download/v1.9.11/robot.jar
          echo "53cd275c8e4c0dad1fc2c1c34174876795cd7d6b6926e1444adcbb0cb3c7ab26  $RUNNER_TEMP/robot.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/robot.jar" validate-profile --input ontology/edso.ttl --profile DL --output "$RUNNER_TEMP/profile.txt" || { cat "$RUNNER_TEMP/profile.txt"; exit 1; }
